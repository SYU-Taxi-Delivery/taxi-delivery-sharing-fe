name: 일반 작업
description: 설정, 문서, 리팩터링 등 개발 작업을 기록합니다.
title: "[Task] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      placeholder: |
        - [ ] 수행할 작업
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 완료 기준·검증 방법
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 자료
